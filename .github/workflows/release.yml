name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'   # Déclenché sur les tags de version : v0.1.0, v1.0.0, etc.

permissions:
  contents: write   # Nécessaire pour créer la release GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          node -e "
            const fs = require('fs');
            ['package.json', 'src-tauri/tauri.conf.json'].forEach(f => {
              const data = JSON.parse(fs.readFileSync(f, 'utf8'));
              data.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(data, null, 2) + '\n');
            });
          "

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                  ${{ secrets.GITHUB_TOKEN }}
          # Pour Rust — embarqué dans le binaire via env!("GITHUB_READONLY_TOKEN")
          GITHUB_READONLY_TOKEN:         ${{ secrets.VITE_GITHUB_READONLY_TOKEN }}
          # Pour Vite — injecté dans le bundle JS via import.meta.env (githubDocs.js)
          VITE_GITHUB_READONLY_TOKEN:    ${{ secrets.VITE_GITHUB_READONLY_TOKEN }}
          # Clé de signature pour l'auto-updater
          # Générer avec : npm run tauri -- signer generate -w ~/.tauri/bcc.key
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName:      ${{ github.ref_name }}
          releaseName:  'BCC Terminal ${{ github.ref_name }}'
          releaseBody:  'Application desktop BCC Terminal pour Windows.'
          releaseDraft: false
          prerelease:   false

      - name: List bundle output (debug)
        shell: pwsh
        run: |
          Write-Host "=== Contenu de src-tauri/target/release/bundle ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName
          } else {
            Write-Host "Dossier bundle introuvable"
            Get-ChildItem -Recurse "src-tauri/target/release" -Depth 2 | Select-Object FullName
          }

      - name: Generate and upload latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $tag     = "${{ github.ref_name }}"

          # Cherche le .nsis.zip et son .sig dans le dossier bundle
          $zipFile = Get-ChildItem -Recurse -Path "src-tauri/target" -Filter "*.nsis.zip"    | Select-Object -First 1
          $sigFile = Get-ChildItem -Recurse -Path "src-tauri/target" -Filter "*.nsis.zip.sig" | Select-Object -First 1

          if (-not $zipFile) { Write-Error "Fichier .nsis.zip introuvable"; exit 1 }
          if (-not $sigFile) { Write-Error "Fichier .nsis.zip.sig introuvable — clé de signature manquante ?"; exit 1 }

          $signature   = (Get-Content $sigFile.FullName -Raw).Trim()
          $downloadUrl = "https://github.com/kissh2021/bcc-terminal/releases/download/$tag/$($zipFile.Name)"
          $pubDate     = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")

          $payload = [ordered]@{
            version  = $version
            notes    = "BCC Terminal $tag"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          }

          $payload | ConvertTo-Json -Depth 5 | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
          Write-Host "latest.json généré :"
          Get-Content "latest.json"

          gh release upload $tag latest.json --clobber

